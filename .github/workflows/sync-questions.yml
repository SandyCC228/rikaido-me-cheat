name: 同步題庫快照

on:
  schedule:
    - cron: '17 19 * * *'   # 每天 04:17 (UTC+9)，rikaido 的深夜
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - run: node src/fetch-questions.js

      - name: 有變動才 commit
        run: |
          if [ -z "$(git status --porcelain assets/questions)" ]; then
            echo "題庫沒有變動"
            exit 0
          fi
          git config user.name SandyCC228
          git config user.email 243731973+SandyCC228@users.noreply.github.com
          git add assets/questions
          git commit -m "chore: 同步題庫快照"
          git push
