name: 同步題庫快照

on:
  schedule:
    - cron: '17 19 * * *'   # 每天 04:17 (UTC+9)，rikaido 的深夜
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - run: node src/fetch-questions.js

      - name: 有變動才 commit
        run: |
          if [ -z "$(git status --porcelain assets/questions)" ]; then
            echo "題庫沒有變動"
            exit 0
          fi
          # 推送權限來自上面的 permissions + checkout 存下的 GITHUB_TOKEN；
          # 身分只影響署名，用 -c 帶過去就好，不寫進 config
          git add assets/questions
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: 同步題庫快照"
          git push
