<style>
  :root {
    --bg: #faf8f4;
    --card: #fff;
    --fg: #1e1b18;
    --muted: #77706a;
    --line: #e7e1d7;
    --ok-bg: #e8f5ec;
    --ok-fg: #1c6b3c;
    --ok-line: #9ed4b4;
    --warn: #a8471f;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a;
      --card: #201f24;
      --fg: #eceae6;
      --muted: #9c968f;
      --line: #33313a;
      --ok-bg: #16341f;
      --ok-fg: #7fd7a1;
      --ok-line: #2f6b45;
      --warn: #e8a07c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.25rem 1rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  h2 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 .75rem; }
  .intro { color: var(--muted); margin: 0 0 1.25rem; font-size: .95rem; }

  form#ask { display: flex; gap: .5rem; flex-wrap: wrap; }
  #input {
    flex: 1 1 12rem; min-width: 0; padding: .7rem .85rem;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--card); color: inherit; font: inherit;
  }
  /* datalist 的下拉箭頭多餘，打字時仍會出現建議 */
  #input::-webkit-calendar-picker-indicator { display: none; }
  button {
    padding: .7rem 1.2rem; border: 0; border-radius: var(--radius);
    background: var(--fg); color: var(--bg);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #input:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--ok-fg); outline-offset: 2px;
  }
  #status { color: var(--muted); min-height: 1.6em; }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
  li {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .7rem .85rem;
  }
  .qhead { display: flex; gap: .5rem; align-items: baseline; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
  .genre { font-size: .85rem; }
  .qtext { font-weight: 600; }
  .opts { display: grid; gap: .35rem; margin-top: .5rem; }
  @media (min-width: 26rem) { .opts { grid-template-columns: 1fr 1fr; } }
  .opt {
    padding: .4rem .6rem; border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted); font-size: .95rem;
  }
  .opt.ok {
    background: var(--ok-bg); border-color: var(--ok-line);
    color: var(--ok-fg); font-weight: 700;
  }
  .fallback { color: var(--warn); }

  details {
    margin: 0 0 1.25rem; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem;
  }
  summary { cursor: pointer; font-weight: 600; }
  details > *:not(summary) { margin-top: .75rem; }
  .note { color: var(--warn); font-size: .9rem; }
  label { display: block; }
  label input {
    display: block; width: 100%; margin-top: .25rem; padding: .6rem .75rem;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: inherit; font: inherit;
  }
  .fields { display: grid; gap: .75rem; }
  @media (min-width: 26rem) { .fields { grid-template-columns: 2fr 1fr; } }
  #smsg:empty { display: none; }
  a { color: var(--ok-fg); }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  nav.langs { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .9rem; }
  nav.langs span { color: var(--muted); }
  .disclaimer { margin: .75rem 0 0; color: var(--muted); font-size: .85rem; }
</style>
<body>
<main>
  <h1>rikaido 正解查詢</h1>
  <p class="intro">貼上 rikaido 的 quiz 網址或 id，就能看到那份 quiz 的全部題目與正解。</p>
  <form id="ask">
    <!-- 建議由 datalist 提供；瀏覽器的表單歷史會混進其他網站的紀錄 -->
    <input id="input" placeholder="貼上 quiz 網址或 id" required autocomplete="off"
           list="recent" aria-label="貼上 quiz 網址或 id">
    <datalist id="recent"></datalist>
    <button>查詢</button>
  </form>
  <p id="status"></p>
  <div id="result"></div>
  <footer>
    <nav class="langs"><a href="https://sandycc228.github.io/rikaido-me-cheat/" hreflang="ja">日本語</a>
    <a href="https://sandycc228.github.io/rikaido-me-cheat/en/" hreflang="en">English</a>
    <a href="https://sandycc228.github.io/rikaido-me-cheat/ko/" hreflang="ko">한국어</a>
    <span>繁體中文</span></nav>
    <p class="disclaimer">非官方的第三方工具，與 <a href="https://rikaido.me/" target="_blank" rel="noopener">rikaido.me</a> 及其開發者無關。</p>
  </footer>
</main>
